# OpsRelay CI: the uptime API, the dashboard and the repair agents.
name: opsrelay-ci

on:
  push:
    branches: [main]
    paths: ["admin-dashboard/**", "agents/**", ".github/workflows/opsrelay-ci.yml"]
  pull_request:
    paths: ["admin-dashboard/**", "agents/**", ".github/workflows/opsrelay-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uptime-api:
    name: Uptime API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: admin-dashboard/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  dashboard:
    name: Dashboard typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-dashboard/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  agents:
    name: Agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest agents/tests -q
