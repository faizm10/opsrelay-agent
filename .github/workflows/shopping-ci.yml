# NovaMart CI. Copy to .github/workflows/shopping-ci.yml at the repository root
# (GitHub only discovers workflows there; this copy lives in shopping/ so the
# shopping app stays self-contained).
name: shopping-ci

on:
  push:
    paths: ["shopping/**", ".github/workflows/shopping-ci.yml"]
  pull_request:
    paths: ["shopping/**", ".github/workflows/shopping-ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: shopping

jobs:
  backend:
    name: Backend tests + checkout probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shopping/backend/requirements.txt
      - name: Install
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt
      - name: Pytest
        working-directory: shopping/backend
        run: .venv/bin/pytest --junitxml=test-results/junit.xml
      - name: Checkout health probe (no side effects)
        if: always()
        working-directory: shopping/backend
        env:
          NOVAMART_DATA_DIR: ${{ runner.temp }}/novamart-data
        shell: bash # explicit bash => -eo pipefail, so a failing probe fails the step
        run: |
          mkdir -p test-results
          .venv/bin/python -m app.probe | tee test-results/checkout-probe.json
      - name: Upload OpsRelay diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: novamart-test-results
          path: |
            shopping/backend/test-results/opsrelay-report.json
            shopping/backend/test-results/junit.xml
            shopping/backend/test-results/checkout-probe.json
          if-no-files-found: warn

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shopping/frontend/package-lock.json
      - working-directory: shopping/frontend
        run: npm ci
      - working-directory: shopping/frontend
        run: npm run typecheck
      - working-directory: shopping/frontend
        run: npm run build
