# Messaging CI (service id: messaging) for NovaConnect.
#
# NOT active: GitHub only runs workflows from .github/workflows/ at the repo root.
# Developer 1 owns that directory. To enable, copy this file to
#   .github/workflows/messaging-ci.yml
# The workflow and job names are distinct from Shopping CI so OpsRelay can tell them apart.
name: Messaging CI

on:
  push:
    paths: ["message-platform/**", ".github/workflows/messaging-ci.yml"]
  pull_request:
    paths: ["message-platform/**", ".github/workflows/messaging-ci.yml"]
  workflow_dispatch:

jobs:
  messaging-backend:
    name: Messaging CI / backend tests + functional probe
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: message-platform/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: message-platform/backend/requirements.txt
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Pytest (exits non-zero on any failure)
        run: .venv/bin/python -m pytest --junitxml=test-results/junit.xml
      - name: Functional messaging probe (exits 1 when unhealthy)
        if: always()
        shell: bash # explicit bash => -eo pipefail, so a failing probe fails the step
        env:
          NOVACONNECT_DB_PATH: ${{ runner.temp }}/novaconnect-ci.db
        run: |
          mkdir -p test-results
          .venv/bin/python -m app.monitor --init-db | tee test-results/messaging-probe.json
      - name: Upload OpsRelay diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: messaging-test-results
          path: |
            message-platform/backend/test-results/opsrelay-report.json
            message-platform/backend/test-results/junit.xml
            message-platform/backend/test-results/messaging-probe.json
          if-no-files-found: warn

  messaging-frontend:
    name: Messaging CI / frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: message-platform/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: message-platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
