# Weekly dependency updates. Minor and patch bumps are grouped into one PR per folder; majors come
# one at a time. When an update breaks CI for an app in agents/apps.toml, the OpsRelay agent tries a
# verified fix and opens it as a PR into the Dependabot branch (agents/README.md, "App configuration").
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/admin-dashboard/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/agents"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/admin-dashboard/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
