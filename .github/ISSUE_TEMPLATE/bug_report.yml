name: Bug report
description: Something in OpsRelay doesn't work as expected.
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Dashboard (web), Uptime API, Repair agent, Other]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, connection strings and other secrets first.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Deployed on Vercel / local ./dev.sh, OS, browser"
