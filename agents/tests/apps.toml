# Test-only app config: the stand-in Shopping and Messaging fixtures built by
# support.py and messaging_support.py. conftest.py points OPSRELAY_APPS_CONFIG here.
# shopping-web stands in for a frontend app (kind = "node").

[apps.shopping]
root = "shopping"
source_dirs = ["shopping/src"]
test_dir = "tests"
pytest_args = ["-q", "-p", "no:cacheprovider", "--no-header", "-rfE"]
timeout_seconds = 120

[apps.messaging]
root = "message-platform"
source_dirs = ["message-platform/src"]
test_dir = "tests"
pytest_args = ["-q", "-p", "no:cacheprovider", "--no-header", "-rfE"]
timeout_seconds = 120

[apps.shopping-web]
kind = "node"
root = "shopping/frontend"
source_dirs = ["shopping/frontend/src", "shopping/frontend/tsconfig.json"]
install = ["npm", "ci", "--no-audit", "--no-fund"]
checks = [["npm", "run", "typecheck"], ["npm", "run", "build"]]
timeout_seconds = 600
baseline_runs = 1
