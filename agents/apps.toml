# Repair scope and fixed test commands for each app the agent may patch and verify.
# root is where the checks run; source_dirs are repo-relative. Repositories without an entry here
# still get diagnosis (agents/diagnose.py), but no verified patch or PR.
#
# A patch may only modify files under source_dirs. Tests, CI workflows,
# dependency manifests and secrets are always rejected, even inside source_dirs.
#
# Python app (pytest runs with the agents interpreter, so its test deps must be installed there):
#   [apps.api]
#   root = "api"
#   source_dirs = ["api/app"]
#   test_dir = "tests"
#   pytest_args = ["-q", "-p", "no:cacheprovider", "--no-header", "-rfE"]
#   timeout_seconds = 120
#
# Node app (kind = "node"): `install` runs once at the failed commit, then every command in `checks`
# must pass. tsconfig.json may be listed in source_dirs so compiler-option changes can be fixed:
#   [apps.web]
#   kind = "node"
#   root = "web"
#   source_dirs = ["web/src", "web/tsconfig.json"]
#   install = ["npm", "ci", "--no-audit", "--no-fund"]
#   checks = [["npm", "run", "typecheck"], ["npm", "run", "build"]]
#   timeout_seconds = 600
#   baseline_runs = 1

[apps]
